name: Paivita KITI Data

on:
  schedule:
    - cron: '0 2 * * *' # Ajaa automaattisesti joka yö klo 02:00
  workflow_dispatch: # Mahdollistaa ajon napista milloin vain

# Annettaan kirjoitusoikeudet, jotta bot voi tallentaa data.json-tiedoston
permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Asenna Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Asenna paketit
        run: pip install requests

      - name: Hae KITI tulokset
        run: python scraper.py

      - name: Tallenna muutokset GitHubiin
        run: |
          git config --global user.name 'KhjA Bot'
          git config --global user.email 'bot@khja.fi'
          git add data.json
          git commit -m "Automaattinen KITI-data päivitys" || exit 0
          git push
