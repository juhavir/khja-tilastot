<!DOCTYPE html>
<html lang="fi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>KITI Tulosvertailu v42.0</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        :root { 
            --bg: #090d16;
            --card-bg: #111827;
            --card-border: #1f293d;
            --primary: #38bdf8;
            --primary-hover: #0ea5e9;
            --text-main: #f3f4f6;
            --text-muted: #9ca3af;
            --danger: #ef4444;
            --warning: #f59e0b;
            --success: #10b981;
            --input-bg: #0d1322;
        }

        * { box-sizing: border-box; }

        body { 
            font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; 
            background-color: var(--bg); 
            color: var(--text-main); 
            margin: 0; 
            padding: 16px; 
            font-size: 0.92rem;
            line-height: 1.5;
        }

        .container { max-width: 1400px; margin: 0 auto; }

        header { 
            background: linear-gradient(135deg, #111827 0%, #1a2234 100%);
            border: 1px solid var(--card-border);
            padding: 20px 24px; 
            margin-bottom: 20px; 
            border-radius: 12px;
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.3);
            display: flex;
            flex-direction: column;
            gap: 4px;
        }
        @media (min-width: 640px) {
            header { flex-direction: row; justify-content: space-between; align-items: center; }
        }

        header h1 { margin: 0; font-size: 1.4rem; color: var(--primary); font-weight: 800; letter-spacing: -0.5px; }
        header p { margin: 0; color: var(--text-muted); font-size: 0.85rem; }

        .grid { display: grid; grid-template-columns: 1fr; gap: 20px; }
        @media (min-width: 1024px) { .grid { grid-template-columns: 320px 1fr; } }

        .card { 
            background: var(--card-bg); 
            padding: 20px; 
            margin-bottom: 20px; 
            border: 1px solid var(--card-border); 
            border-radius: 12px;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.2);
        }

        h2 { 
            font-size: 0.95rem; 
            margin: 0 0 16px 0; 
            color: var(--primary); 
            border-bottom: 1px solid var(--card-border); 
            padding-bottom: 8px; 
            text-transform: uppercase;
            letter-spacing: 0.8px;
            font-weight: 700;
        }

        label { display: block; margin-top: 12px; font-weight: 600; font-size: 0.75rem; color: var(--text-muted); text-transform: uppercase; letter-spacing: 0.5px; }
        label:first-of-type { margin-top: 0; }

        select, input { 
            width: 100%; 
            padding: 10px 12px; 
            margin-top: 6px; 
            background-color: var(--input-bg);
            border: 1px solid var(--card-border); 
            color: var(--text-main);
            font-size: 0.9rem; 
            border-radius: 8px;
            outline: none;
            transition: border-color 0.2s, box-shadow 0.2s;
        }

        select:focus, input:focus { 
            border-color: var(--primary); 
            box-shadow: 0 0 0 3px rgba(56, 189, 248, 0.15);
        }

        button { 
            width: 100%; 
            background-color: var(--primary); 
            color: #0b132a; 
            font-weight: 700; 
            border: none; 
            padding: 11px 16px; 
            font-size: 0.85rem;
            border-radius: 8px;
            cursor: pointer; 
            margin-top: 16px; 
            text-transform: uppercase;
            letter-spacing: 0.5px;
            transition: background-color 0.2s, transform 0.1s;
        }

        button:hover { background-color: var(--primary-hover); }
        button:active { transform: scale(0.98); }
        button:disabled { background-color: #1f293d; color: var(--text-muted); cursor: not-allowed; transform: none; }

        .btn-danger { 
            background-color: rgba(239, 68, 68, 0.1); 
            color: var(--danger); 
            border: 1px solid rgba(239, 68, 68, 0.3); 
            margin: 0; 
            padding: 4px 10px; 
            font-size: 0.75rem; 
            width: auto; 
            border-radius: 6px;
        }
        .btn-danger:hover { background-color: var(--danger); color: white; }

        .stats-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 12px; margin-bottom: 20px; }

        .stat-box { 
            background: var(--input-bg); 
            padding: 14px; 
            border: 1px solid var(--card-border); 
            border-radius: 10px;
        }

        .stat-header { font-size: 0.85rem; font-weight: 700; margin-bottom: 10px; display: flex; justify-content: space-between; align-items: center; }
        
        .sub-stats-grid { display: grid; grid-template-columns: repeat(6, 1fr); gap: 2px; text-align: center; background: rgba(0,0,0,0.2); padding: 5px; border-radius: 6px; border: 1px solid var(--card-border); margin-bottom: 8px; }
        .sub-stat { display: flex; flex-direction: column; cursor: help; }
        .sub-stat .val { font-weight: 800; font-size: 0.85rem; color: var(--text-main); }
        .sub-stat .lbl { font-size: 0.48rem; color: var(--text-muted); margin-top: 2px; font-weight: 600; }

        .extra-stats { display: grid; grid-template-columns: repeat(4, 1fr); gap: 4px; text-align: center; font-size: 0.7rem; color: var(--text-muted); background: rgba(255,255,255,0.02); padding: 6px; border-radius: 6px; border: 1px solid var(--card-border); }
        .extra-stats > div { cursor: help; }
        .extra-stats b { color: var(--text-main); display: block; font-size: 0.8rem; }

        .chart-container { position: relative; width: 100%; height: 320px; }

        .table-responsive { overflow-x: auto; -webkit-overflow-scrolling: touch; border-radius: 8px; border: 1px solid var(--card-border); }

        table { width: 100%; border-collapse: collapse; font-size: 0.85rem; text-align: left; }
        th, td { padding: 10px 12px; border-bottom: 1px solid var(--card-border); white-space: nowrap; }
        th { background-color: var(--input-bg); color: var(--text-muted); font-weight: 700; text-transform: uppercase; font-size: 0.72rem; letter-spacing: 0.5px; }
        tr:last-child td { border-bottom: none; }
        tr:hover td { background-color: rgba(255, 255, 255, 0.01); }

        .ampuja-item { 
            display: flex; 
            justify-content: space-between; 
            align-items: center; 
            background: var(--input-bg); 
            padding: 8px 12px; 
            margin-top: 6px; 
            border: 1px solid var(--card-border);
            border-radius: 8px;
            font-size: 0.85rem; 
        }

        .ampuja-checkbox-wrap {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .ampuja-checkbox-wrap input[type="checkbox"] {
            width: 16px;
            height: 16px;
            margin: 0;
            cursor: pointer;
            accent-color: var(--primary);
        }

        #statusText { font-size: 0.8rem; color: var(--primary); margin-top: 10px; text-align: center; word-break: break-word; font-weight: 600; }
        .tag { background: #1f293d; color: var(--text-main); padding: 3px 8px; font-size: 0.75rem; font-weight: 600; border-radius: 4px; display: inline-block; }
        .tag-laji { background: rgba(56, 189, 248, 0.15); color: var(--primary); border: 1px solid rgba(56, 189, 248, 0.3); }

        .info-box { 
            background: rgba(245, 158, 11, 0.1); 
            border: 1px solid rgba(245, 158, 11, 0.3); 
            color: #fbbf24; 
            padding: 12px 16px; 
            font-size: 0.85rem; 
            margin-bottom: 20px;
            border-radius: 8px;
            font-weight: 500;
        }
    </style>
</head>
<body>

<div class="container">
    <header>
        <h1>🎯 KITI Tulosvertailu</h1>
        <p>Ampumaurheilun tulos- ja kehitysseuranta</p>
    </header>

    <div class="grid">
        <!-- Sivupaneeli -->
        <div>
            <div class="card">
                <h2>Lisää ampuja</h2>
                <label for="uusiNimi">Nimi</label>
                <input type="text" id="uusiNimi" placeholder="Esim. Joni Virtanen">

                <label for="uusiId" style="margin-top: 10px;">Sportti-ID</label>
                <input type="text" id="uusiId" placeholder="Esim. 29364659">

                <button id="lisaaBtn" onclick="lisaaJaHaeAmpuja()">+ Hae tulokset</button>
                <div id="statusText"></div>

                <div style="display:flex; justify-content:space-between; align-items:center; margin-top: 18px; border-top: 1px solid var(--card-border); padding-top: 14px;">
                    <label style="margin:0;">Tallennetut (max 5)</label>
                    <span id="ampujatMaara" style="font-size:0.8rem; color:var(--primary); font-weight:bold;">0/5</span>
                </div>
                <div id="ampujatLista" style="margin-top: 6px;"></div>
            </div>

            <div class="card">
                <h2>Suodatus</h2>
                <label for="lajiSelect">Laji</label>
                <select id="lajiSelect" onchange="paivitaValikot(false); paivitaNakyma();">
                    <option value="Kaikki">Kaikki lajit</option>
                </select>

                <label for="sarjaSelect">Sarja</label>
                <select id="sarjaSelect" onchange="paivitaNakyma();">
                    <option value="Kaikki">Kaikki sarjat</option>
                </select>

                <label for="maaraSelect">Kilpailujen määrä</label>
                <select id="maaraSelect" onchange="paivitaNakyma();">
                    <option value="kaikki" selected>Kaikki kisat</option>
                    <option value="3">Viimeiset 3 kilpailua</option>
                    <option value="5">Viimeiset 5 kilpailua</option>
                    <option value="10">Viimeiset 10 kilpailua</option>
                </select>
            </div>
        </div>

        <!-- Pääsisältö -->
        <div>
            <div id="vertailuIlmoitus" class="info-box" style="display: none;">
                ⚠️ Tarkkaa vertailua varten valitse vasemmalta tietty <b>Laji</b> ja <b>Sarja</b>.
            </div>

            <div class="card">
                <h2>Statistiikka</h2>
                <div id="ampujatStats" class="stats-grid"></div>
                <div class="chart-container">
                    <canvas id="tulosKaavio"></canvas>
                </div>
            </div>

            <div class="card" style="margin-bottom: 0;">
                <h2>Tuloshistoria</h2>
                <div class="table-responsive">
                    <table>
                        <thead>
                            <tr>
                                <th>Pvm</th>
                                <th>Kilpailu</th>
                                <th>Ampuja</th>
                                <th>Laji</th>
                                <th>Sarja</th>
                                <th>Tulos</th>
                            </tr>
                        </thead>
                        <tbody id="tulosTaulukko"></tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>
</div>

<script>
const KITI_VERSIO = "v42.0_SORTED_RANK";
if (localStorage.getItem("kiti_versio") !== KITI_VERSIO) {
    localStorage.clear();
    localStorage.setItem("kiti_versio", KITI_VERSIO);
}

let ampujat = JSON.parse(localStorage.getItem("kiti_ampujat")) || [];
let tulosData = JSON.parse(localStorage.getItem("kiti_tulokset")) || [];
let myChart = null;

const variPaletti = ['#38bdf8', '#f87171', '#34d399', '#fbbf24', '#c084fc'];

function alusta() {
    ampujat.forEach(a => { if (a.aktiivinen === undefined) a.aktiivinen = true; });
    paivitaAmpujatLista();
    paivitaValikot(true);
    paivitaNakyma();
}

// Haetaan sijoitus lataamalla sivut, järjestämällä tulokset parhaasta huonoimpaan ja poimimalla uniikit ampujat
async function haeTarkkaSijoitus(ampujaNimi, sportId, categoryId) {
    if (!sportId || !categoryId) return "-";

    try {
        const etsittavaKokoNimi = ampujaNimi.trim().toLowerCase();
        const osat = etsittavaKokoNimi.split(" ");
        const etunimi = osat[0];
        const sukunimi = osat[osat.length - 1];

        let kaikkiRivit = [];

        // Ladataan useampi sivu (esim. 4 sivua = 100 parasta tulosta)
        for (let page = 1; page <= 4; page++) {
            const url = `/api/statistics?sport=${sportId}&category=${categoryId}&page=${page}&nocache=${Date.now()}`;
            const response = await fetch(url);
            if (!response.ok) break;

            const data = await response.json();
            const rows = Array.isArray(data) ? data : (data.content || data.results || data.data || []);
            if (rows.length === 0) break;

            kaikkiRivit.push(...rows);
        }

        if (kaikkiRivit.length === 0) return "-";

        // Muunnetaan rivit ja järjestetään tuloksen mukaan laskevasti (suurin tulos ensin)
        const prosessoidutRivit = kaikkiRivit.map(r => {
            const tRaw = r.score !== undefined ? r.score : (r.totalScore !== undefined ? r.totalScore : (r.result !== undefined ? r.result : 0));
            const tulos = parseFloat(String(tRaw).replace(",", ".")) || 0;

            let nimi = "";
            if (r.competitor && typeof r.competitor === 'object') {
                nimi = `${r.competitor.first_name || ''} ${r.competitor.last_name || ''}`.trim();
            } else if (r.shooter && typeof r.shooter === 'object') {
                nimi = `${r.shooter.first_name || ''} ${r.shooter.last_name || ''}`.trim();
            } else {
                nimi = String(r.shooter_name || r.competitor_name || r.name || "").trim();
            }

            return { nimi: nimi.toLowerCase(), tulos, raw: r };
        }).filter(r => r.nimi.length > 0);

        // Järjestetään parhaan tuloksen mukaan (korkein pistemäärä ylimpänä)
        prosessoidutRivit.sort((a, b) => b.tulos - a.tulos);

        // Lasketaan uniikit ampujat oikeassa ranking-järjestyksessä
        const nahdytUrheilijat = new Set();
        let sijoitusLaskuri = 0;

        for (const rivi of prosessoidutRivit) {
            const tunniste = rivi.nimi;
            
            if (!nahdytUrheilijat.has(tunniste)) {
                nahdytUrheilijat.add(tunniste);
                sijoitusLaskuri++;

                const onOsuma = (tunniste === etsittavaKokoNimi) || 
                                (tunniste.includes(etunimi) && tunniste.includes(sukunimi));

                if (onOsuma) {
                    return `${sijoitusLaskuri}.`;
                }
            }
        }
    } catch (e) {
        console.error("Virhe sijoitushaussa:", e);
    }

    return "-";
}

function etsiKilpailunNimi(row) {
    if (row.competition_name) return String(row.competition_name);
    if (row.competitionName) return String(row.competitionName);
    if (row.name) return String(row.name);
    
    if (row.competition && typeof row.competition === 'object') {
        const c = row.competition;
        if (c.name) return String(c.name);
        if (c.competition_name) return String(c.competition_name);
    }
    return "Kilpailu";
}

function tunnistaLaji(row) {
    const txt = JSON.stringify(row).toLowerCase();
    const kisaNimi = etsiKilpailunNimi(row).toLowerCase();
    const tVal = parseFloat(String(row.score !== undefined ? row.score : (row.totalScore !== undefined ? row.totalScore : (row.result !== undefined ? row.result : 0))).replace(",", "."));

    if (txt.includes("ilmakivääri") || txt.includes("ikv") || txt.includes("air rifle")) {
        return "Ilmakivääri";
    }
    
    if (txt.includes("pienoiskivääri") || txt.includes("pkv") || txt.includes("50m") || txt.includes("300m") || kisaNimi.includes("pienoiskivääri") || kisaNimi.includes("50m")) {
        const onAsentoNimessa = txt.includes("asento") || txt.includes("3x") || txt.includes("3 x") || txt.includes("40") || kisaNimi.includes("asento") || kisaNimi.includes("3x");
        
        if (tVal > 800 || (onAsentoNimessa && tVal > 700)) {
            return "Pienoiskivääri 3x20/3x40 (Asento)";
        }
        return "Pienoiskivääri Makuu";
    }

    if (txt.includes("ilmapistooli") || txt.includes("ipis") || txt.includes("air pistol")) return "Ilmapistooli";
    if (txt.includes("pistooli")) return "Pistooli";
    
    if (txt.includes("kivääri")) {
        return (tVal > 800) ? "Kivääri 3x20/3x40 (Asento)" : "Kivääri Makuu";
    }

    return row.eventName || row.sportName || row.sport || "Muu laji";
}

function tunnistaSarja(row) {
    if (row.category && typeof row.category === 'object') return row.category.code || row.category.name || "Muu";
    if (row.category) return String(row.category);
    if (row.series) return String(row.series);
    if (row.class_name) return String(row.class_name);
    if (row.className) return String(row.className);
    if (row.category_code) return String(row.category_code);
    return "Muu";
}

function tunnistaKisanPaivamaara(row) {
    let pvm = "";
    if (row.competition_start_date) pvm = row.competition_start_date;
    else if (row.start_date) pvm = row.start_date;
    else if (row.competition && typeof row.competition === 'object') {
        const c = row.competition;
        pvm = c.start_date || c.competition_start_date || c.date || "";
    }
    else if (row.date) pvm = row.date;

    if (pvm) return String(pvm).substring(0, 10);

    const txt = JSON.stringify(row);
    const isoMatch = txt.match(/\b(202[4-6]-(?:0[1-9]|1[0-2])-(?:0[1-9]|[12][0-9]|3[01]))\b/);
    if (isoMatch) return isoMatch[1];

    return "2026-01-01";
}

async function lisaaJaHaeAmpuja() {
    if (ampujat.length >= 5) {
        alert("Voit lisätä enintään 5 ampujaa vertailuun.");
        return;
    }

    const nimi = document.getElementById("uusiNimi").value.trim();
    const id = document.getElementById("uusiId").value.trim();
    if (!nimi || !id) return alert("Nimi ja Sportti-ID vaaditaan!");

    const statusEl = document.getElementById("statusText");
    statusEl.innerText = `Haetaan tuloksia...`;

    try {
        const response = await fetch(`/api/kiti?id=${id}&nocache=${Date.now()}`);
        const contentType = response.headers.get("content-type");

        if (!contentType || !contentType.includes("application/json")) {
            throw new Error(`Palvelinvirhe (${response.status}).`);
        }

        const resData = await response.json();
        if (!response.ok) throw new Error(resData.error || `Palvelinvirhe (${response.status})`);

        const rows = Array.isArray(resData) ? resData : (resData.content || resData.results || resData.data || []);

        if (rows.length === 0) {
            throw new Error("Antamallasi Sportti-ID:llä ei löytynyt tuloksia.");
        }

        const uudet = rows.map((row) => {
            const tRaw = row.score !== undefined ? row.score : (row.totalScore !== undefined ? row.totalScore : (row.result !== undefined ? row.result : 0));
            const tulos = parseFloat(String(tRaw).replace(",", "."));
            
            const sportId = row.sport_id || row.sportId || (row.sport && row.sport.id) || "1";
            const categoryId = row.category_id || row.categoryId || (row.category && row.category.id) || "8";

            return {
                pvm: tunnistaKisanPaivamaara(row),
                kilpailu: etsiKilpailunNimi(row),
                ampuja: nimi,
                laji: tunnistaLaji(row),
                sarja: tunnistaSarja(row),
                tulos: tulos,
                sportId: String(sportId),
                categoryId: String(categoryId)
            };
        }).filter(r => r.tulos > 0);

        if (uudet.length > 0) {
            if (!ampujat.some(a => a.id === id)) {
                ampujat.push({ nimi, id, aktiivinen: true });
            } else {
                let olemassa = ampujat.find(a => a.id === id);
                olemassa.nimi = nimi;
            }
            localStorage.setItem("kiti_ampujat", JSON.stringify(ampujat));

            tulosData = [...tulosData.filter(d => d.ampuja !== nimi), ...uudet];
            localStorage.setItem("kiti_tulokset", JSON.stringify(tulosData));

            statusEl.innerText = `Löytyi ${uudet.length} tulosta!`;
            
            document.getElementById("uusiNimi").value = "";
            document.getElementById("uusiId").value = "";
            paivitaAmpujatLista();
            paivitaValikot(true);
            paivitaNakyma();
        } else {
            statusEl.innerText = "Ei kelvollisia tuloksia.";
        }
    } catch (e) {
        statusEl.innerText = `Virhe: ${e.message}`;
    }
}

function vaihdaAmpujanTila(index, state) {
    ampujat[index].aktiivinen = state;
    localStorage.setItem("kiti_ampujat", JSON.stringify(ampujat));
    paivitaNakyma();
}

function poistaAmpuja(index) {
    const poistettava = ampujat[index];
    ampujat.splice(index, 1);
    localStorage.setItem("kiti_ampujat", JSON.stringify(ampujat));
    
    tulosData = tulosData.filter(d => d.ampuja !== poistettava.nimi);
    localStorage.setItem("kiti_tulokset", JSON.stringify(tulosData));

    paivitaAmpujatLista();
    paivitaValikot(false);
    paivitaNakyma();
}

function paivitaAmpujatLista() {
    const lista = document.getElementById("ampujatLista");
    const maaraEl = document.getElementById("ampujatMaara");
    const lisaaBtn = document.getElementById("lisaaBtn");

    maaraEl.innerText = `${ampujat.length}/5`;
    lisaaBtn.disabled = ampujat.length >= 5;

    if (ampujat.length === 0) {
        lista.innerHTML = '<p style="font-size:0.8rem; color:var(--text-muted); margin:4px 0;">Ei tallennettuja ampujia.</p>';
        return;
    }
    lista.innerHTML = ampujat.map((a, i) => `
        <div class="ampuja-item">
            <div class="ampuja-checkbox-wrap">
                <input type="checkbox" id="amp_chk_${i}" ${a.aktiivinen !== false ? 'checked' : ''} onchange="vaihdaAmpujanTila(${i}, this.checked)">
                <label for="amp_chk_${i}" style="margin:0; cursor:pointer; font-weight:600; color:var(--text-main); font-size:0.85rem; text-transform:none;">${a.nimi}</label>
            </div>
            <button class="btn-danger" onclick="poistaAmpuja(${i})">Poista</button>
        </div>
    `).join("");
}

function jarjestaPvmMukaan(dataArr, uusinEnsin = true) {
    return [...dataArr].sort((a, b) => {
        const timeA = new Date(a.pvm).getTime() || 0;
        const timeB = new Date(b.pvm).getTime() || 0;
        return uusinEnsin ? timeB - timeA : timeA - timeB;
    });
}

function paivitaValikot(asetaUusinOletukseksi = false) {
    const lajiSelect = document.getElementById("lajiSelect");
    const sarjaSelect = document.getElementById("sarjaSelect");

    const valittuLaji = lajiSelect.value;
    let valittuSarja = sarjaSelect.value;

    const lajit = ["Kaikki", ...new Set(tulosData.map(d => d.laji))];
    lajiSelect.innerHTML = lajit.map(l => `<option value="${l}">${l}</option>`).join("");

    if (asetaUusinOletukseksi && tulosData.length > 0) {
        const uusinRivi = jarjestaPvmMukaan(tulosData, true)[0];
        if (uusinRivi) {
            if (lajit.includes(uusinRivi.laji)) {
                lajiSelect.value = uusinRivi.laji;
            }
            valittuSarja = uusinRivi.sarja;
        }
    } else if (lajit.includes(valittuLaji)) {
        lajiSelect.value = valittuLaji;
    }

    const aktiivinenLaji = lajiSelect.value;
    const suodatettuData = tulosData.filter(d => aktiivinenLaji === "Kaikki" || d.laji === aktiivinenLaji);
    const sarjat = ["Kaikki", ...new Set(suodatettuData.map(d => d.sarja))];
    sarjaSelect.innerHTML = sarjat.map(s => `<option value="${s}">${s}</option>`).join("");

    if (sarjat.includes(valittuSarja)) {
        sarjaSelect.value = valittuSarja;
    } else if (asetaUusinOletukseksi && suodatettuData.length > 0) {
        const uusinRivi = jarjestaPvmMukaan(suodatettuData, true)[0];
        if (uusinRivi && sarjat.includes(uusinRivi.sarja)) {
            sarjaSelect.value = uusinRivi.sarja;
        }
    }
}

function laskeKA(arr) {
    if (!arr || arr.length === 0) return "-";
    return (arr.reduce((a, b) => a + b, 0) / arr.length).toFixed(1);
}

function laskeKisakunto(arr) {
    if (!arr || arr.length === 0) return "-";
    const viisi = arr.slice(0, 5);
    if (viisi.length <= 2) {
        return laskeKA(viisi);
    }
    const kopio = [...viisi].sort((a, b) => a - b);
    kopio.shift();
    kopio.pop();
    if (kopio.length === 0) return laskeKA(viisi);
    return (kopio.reduce((a, b) => a + b, 0) / kopio.length).toFixed(1);
}

function laskeHajonta(arr) {
    if (!arr || arr.length < 2) return "0.0";
    const ka = arr.reduce((a, b) => a + b, 0) / arr.length;
    const neliotSumma = arr.reduce((a, b) => a + Math.pow(b - ka, 2), 0);
    return Math.sqrt(neliotSumma / arr.length).toFixed(1);
}

function paivitaNakyma() {
    const valittuLaji = document.getElementById("lajiSelect").value;
    const valittuSarja = document.getElementById("sarjaSelect").value;
    const maaraValinta = document.getElementById("maaraSelect").value;
    const infoEl = document.getElementById("vertailuIlmoitus");

    const aktiivisetAmpujat = ampujat.filter(a => a.aktiivinen !== false);
    const aktiivisetAmpujatNimet = aktiivisetAmpujat.map(a => a.nimi);

    const onEiValittu = (valittuLaji === "Kaikki" || valittuSarja === "Kaikki");
    if (aktiivisetAmpujatNimet.length > 1 && onEiValittu) {
        infoEl.style.display = "block";
    } else {
        infoEl.style.display = "none";
    }

    let data = tulosData.filter(d => 
        aktiivisetAmpujatNimet.includes(d.ampuja) &&
        (valittuLaji === "Kaikki" || d.laji === valittuLaji) &&
        (valittuSarja === "Kaikki" || d.sarja === valittuSarja)
    );

    const statsContainer = document.getElementById("ampujatStats");

    if (aktiivisetAmpujat.length > 0) {
        statsContainer.innerHTML = aktiivisetAmpujat.map((ampObj, idx) => {
            const amp = ampObj.nimi;
            const aRivitKaikki = jarjestaPvmMukaan(data.filter(d => d.ampuja === amp), true);
            
            let aRivitRajattu = aRivitKaikki;
            if (maaraValinta !== "kaikki") {
                const rajoitus = parseInt(maaraValinta, 10);
                aRivitRajattu = aRivitKaikki.slice(0, rajoitus);
            }

            const aTuloksetRajatut = aRivitRajattu.map(d => d.tulos);
            
            const kaValitut = laskeKA(aTuloksetRajatut);
            const kisakunto = laskeKisakunto(aTuloksetRajatut);
            const kaV3 = laskeKA(aTuloksetRajatut.slice(0, 3));
            const kaV5 = laskeKA(aTuloksetRajatut.slice(0, 5));
            const kaV10 = laskeKA(aTuloksetRajatut.slice(0, 10));

            const lbl1 = maaraValinta === "kaikki" ? "Valitut (Kaikki)" : `Valitut (${aRivitRajattu.length} kpl)`;
            const lbl2 = "Viimeiset 3";
            const lbl3 = "Viimeiset 5";
            const lbl4 = "Viimeiset 10";

            const pb = aRivitKaikki.length > 0 ? Math.max(...aRivitKaikki.map(d => d.tulos)) : "-";
            const valitunAjanParas = aTuloksetRajatut.length > 0 ? Math.max(...aTuloksetRajatut) : pb;
            const valitunAjanHeikoin = aTuloksetRajatut.length > 0 ? Math.min(...aTuloksetRajatut) : "-";

            let trendiTxt = "-";
            if (aRivitRajattu.length >= 2) {
                const ero = (aRivitRajattu[0].tulos - aRivitRajattu[1].tulos).toFixed(1);
                trendiTxt = ero > 0 ? `+${ero}` : `${ero}`;
            }

            const hajonta = laskeHajonta(aTuloksetRajatut);
            const vari = variPaletti[idx % variPaletti.length];

            return `
                <div class="stat-box" style="border-top: 3px solid ${vari};">
                    <div class="stat-header" style="color:${vari};">${amp} <span style="font-size:0.75rem; color:var(--text-muted); font-weight:normal;">(${aRivitRajattu.length} kisaa näytössä)</span></div>
                    <div class="sub-stats-grid">
                        <div class="sub-stat" title="Sijoitus Kitin tilastossa valitulle lajille ja sarjalle"><span class="val" id="sij_el_${ampObj.id}" style="color:var(--success);">...</span><span class="lbl">Sijoitus</span></div>
                        <div class="sub-stat" title="Keskiarvo kaikista tällä hetkellä näytöllä olevista valituista kilpailuista"><span class="val">${kaValitut}</span><span class="lbl">${lbl1}</span></div>
                        <div class="sub-stat" title="Tämänhetkinen kisakunto: Viimeisen 5 kilpailun keskiarvo, josta paras ja heikoin tulos on poistettu"><span class="val" style="color:var(--primary);">${kisakunto}</span><span class="lbl">Kisakunto</span></div>
                        <div class="sub-stat" title="Viimeisen 3 kilpailun keskiarvo"><span class="val">${kaV3}</span><span class="lbl">${lbl2}</span></div>
                        <div class="sub-stat" title="Viimeisen 5 kilpailun keskiarvo"><span class="val">${kaV5}</span><span class="lbl">${lbl3}</span></div>
                        <div class="sub-stat" title="Viimeisen 10 kilpailun keskiarvo"><span class="val">${kaV10}</span><span class="lbl">${lbl4}</span></div>
                    </div>
                    <div class="extra-stats">
                        <div title="Koko historian / valinnan korkein tulos">Ennätys (PB)<b>${pb}</b></div>
                        <div title="Valitun ajanjakson / rajauksen paras tulos">Valitun paras<b>${valitunAjanParas}</b></div>
                        <div title="Valitun ajanjakson / rajauksen matalin tulos">Valitun heikoin<b>${valitunAjanHeikoin}</b></div>
                        <div title="Tulosten keskihajonta (±) sekä viimeisimmän kisan muutos edelliseen (+/-)">Hajonta / Trendi<b>±${hajonta} (${trendiTxt})</b></div>
                    </div>
                </div>
            `;
        }).join("");

        // Haetaan dynaamisesti sijoitus nykyiselle valinnalle (Laji + Sarja)
        aktiivisetAmpujat.forEach(async (ampObj) => {
            const elem = document.getElementById(`sij_el_${ampObj.id}`);
            
            const ampujaRivit = data.filter(d => d.ampuja === ampObj.nimi);
            let targetSportId = null;
            let targetCategoryId = null;

            if (ampujaRivit.length > 0) {
                targetSportId = ampujaRivit[0].sportId;
                targetCategoryId = ampujaRivit[0].categoryId;
            } else {
                const kaikkirivit = tulosData.filter(d => d.ampuja === ampObj.nimi);
                if (kaikkirivit.length > 0) {
                    targetSportId = kaikkirivit[0].sportId;
                    targetCategoryId = kaikkirivit[0].categoryId;
                }
            }

            if (targetSportId && targetCategoryId) {
                const sij = await haeTarkkaSijoitus(ampObj.nimi, targetSportId, targetCategoryId);
                if (elem) elem.innerText = sij;
            } else {
                if (elem) elem.innerText = "-";
            }
        });

    } else {
        statsContainer.innerHTML = '<div style="font-size:0.8rem; color:var(--text-muted); padding:8px;">Ei aktiivisia ampujia valittuna.</div>';
    }

    let taulukkoData = data;
    if (maaraValinta !== "kaikki") {
        const rajoitus = parseInt(maaraValinta, 10);
        let ryhmitetty = [];
        aktiivisetAmpujatNimet.forEach(amp => {
            const ampujaRivit = jarjestaPvmMukaan(data.filter(d => d.ampuja === amp), true).slice(0, rajoitus);
            ryhmitetty.push(...ampujaRivit);
        });
        taulukkoData = ryhmitetty;
    }

    const tbody = document.getElementById("tulosTaulukko");
    tbody.innerHTML = jarjestaPvmMukaan(taulukkoData, true).map((d) => `
        <tr>
            <td><b>${d.pvm}</b></td>
            <td style="color: var(--text-muted);">${d.kilpailu}</td>
            <td><b>${d.ampuja}</b></td>
            <td><span class="tag tag-laji">${d.laji}</span></td>
            <td><span class="tag">${d.sarja}</span></td>
            <td><b>${d.tulos}</b></td>
        </tr>
    `).join("");

    piirraKaavio(taulukkoData);
}

function piirraKaavio(data) {
    const ctx = document.getElementById('tulosKaavio').getContext('2d');
    
    if (myChart) { myChart.destroy(); }

    const aktiivisetAmpujatNimet = ampujat.filter(a => a.aktiivinen !== false).map(a => a.nimi);
    const jarjestettyKokoData = jarjestaPvmMukaan(data, false);
    
    const labelSet = new Set();
    jarjestettyKokoData.forEach(d => {
        labelSet.add(`${d.pvm} (${d.kilpailu})`);
    });
    const labels = Array.from(labelSet);

    const datasets = aktiivisetAmpujatNimet.map((amp, idx) => {
        const ampujaRivit = data.filter(d => d.ampuja === amp);
        const vari = variPaletti[idx % variPaletti.length];
        
        const pointData = labels.map(lbl => {
            const hit = ampujaRivit.find(d => `${d.pvm} (${d.kilpailu})` === lbl);
            return hit ? hit.tulos : null;
        });

        return {
            label: amp,
            data: pointData,
            borderColor: vari,
            backgroundColor: vari,
            borderWidth: 2.5,
            tension: 0.15,
            spanGaps: true,
            pointRadius: 4,
            pointHoverRadius: 6
        };
    });

    myChart = new Chart(ctx, {
        type: 'line',
        data: { 
            labels: labels,
            datasets: datasets 
        },
        options: {
            responsive: true,
            maintainAspectRatio: false,
            plugins: { 
                legend: { 
                    display: true, 
                    position: 'top',
                    labels: { color: '#f3f4f6', boxWidth: 12, font: { size: 11, weight: '600' } }
                },
                tooltip: {
                    callbacks: {
                        label: function(context) {
                            return `${context.dataset.label}: ${context.raw} pnt`;
                        }
                    }
                }
            },
            scales: { 
                x: { 
                    ticks: {
                        color: '#9ca3af',
                        maxRotation: 45,
                        minRotation: 45,
                        font: { size: 10 }
                    },
                    grid: { color: '#1a2234' }
                },
                y: {
                    ticks: { color: '#9ca3af', font: { size: 10 } },
                    grid: { color: '#1a2234' }
                }
            }
        }
    });
}

window.onload = alusta;
</script>
