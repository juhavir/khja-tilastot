<!DOCTYPE html>
<html lang="fi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ampumaurheilun tulostilastojen statistiikkaohjelma v108.0</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        :root { 
            --bg: #030712;
            --card-bg: rgba(15, 23, 42, 0.65);
            --card-border: rgba(56, 189, 248, 0.15);
            --card-glow: rgba(56, 189, 248, 0.25);
            --primary: #38bdf8;
            --primary-gradient: linear-gradient(135deg, #38bdf8 0%, #0284c7 100%);
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --danger: #f43f5e;
            --gold: #fbbf24;
            --silver: #e2e8f0;
            --bronze: #d97706;
            --input-bg: rgba(15, 23, 42, 0.8);
            --glass-reflection: linear-gradient(135deg, rgba(255,255,255,0.08) 0%, rgba(255,255,255,0) 60%);
        }

        [data-theme="light"] {
            --bg: #f8fafc;
            --card-bg: rgba(255, 255, 255, 0.85);
            --card-border: rgba(14, 165, 233, 0.2);
            --card-glow: rgba(14, 165, 233, 0.15);
            --primary: #0284c7;
            --primary-gradient: linear-gradient(135deg, #0284c7 0%, #0369a1 100%);
            --text-main: #0f172a;
            --text-muted: #64748b;
            --danger: #e11d48;
            --gold: #d97706;
            --silver: #475569;
            --bronze: #b45309;
            --input-bg: #ffffff;
            --glass-reflection: linear-gradient(135deg, rgba(255,255,255,0.6) 0%, rgba(255,255,255,0) 60%);
        }

        * { box-sizing: border-box; }

        body { 
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif; 
            background-color: var(--bg);
            background-image: 
                radial-gradient(at 0% 0%, rgba(56, 189, 248, 0.08) 0px, transparent 50%),
                radial-gradient(at 100% 100%, rgba(14, 165, 233, 0.05) 0px, transparent 50%);
            background-attachment: fixed;
            color: var(--text-main); 
            margin: 0; 
            padding: 16px; 
            font-size: 1.05rem;
            line-height: 1.5;
            min-height: 100vh;
        }

        .container { max-width: 1400px; margin: 0 auto; }

        .glass-card {
            background: var(--card-bg);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid var(--card-border);
            border-radius: 16px;
            position: relative;
            overflow: hidden;
            box-shadow: 0 10px 30px -10px rgba(0,0,0,0.3);
            transition: border-color 0.3s, box-shadow 0.3s;
        }
        
        .glass-card::before {
            content: '';
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            background: var(--glass-reflection);
            pointer-events: none;
            z-index: 1;
        }

        header { 
            padding: 20px 28px; 
            margin-bottom: 20px; 
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .header-content { display: flex; align-items: center; gap: 20px; }
        .header-target-icon { width: 48px; height: 48px; flex-shrink: 0; }

        .header-text h1 { 
            margin: 0; 
            font-size: 1.6rem; 
            color: var(--text-main); 
            font-weight: 800; 
            letter-spacing: -0.5px;
        }

        .header-text p { 
            margin: 2px 0 0 0; 
            color: var(--text-muted); 
            font-size: 0.95rem; 
            font-weight: 500;
        }

        .theme-btn {
            background: var(--input-bg);
            border: 1px solid var(--card-border);
            color: var(--text-main);
            padding: 10px 18px;
            border-radius: 10px;
            cursor: pointer;
            font-size: 0.95rem;
            font-weight: 700;
            transition: all 0.2s;
            z-index: 2;
        }
        .theme-btn:hover { border-color: var(--primary); transform: translateY(-1px); }

        .grid { display: grid; grid-template-columns: 1fr; gap: 20px; }
        @media (min-width: 1024px) { .grid { grid-template-columns: 320px 1fr; } }

        .card-inner { padding: 20px; z-index: 2; position: relative; }

        h2 { 
            font-size: 0.95rem; 
            margin: 0 0 16px 0; 
            color: var(--primary); 
            text-transform: uppercase;
            letter-spacing: 1.5px;
            font-weight: 800;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        label { display: block; margin-top: 14px; font-weight: 700; font-size: 0.82rem; color: var(--text-muted); text-transform: uppercase; letter-spacing: 0.8px; }
        label:first-of-type { margin-top: 0; }

        select, input { 
            width: 100%; 
            padding: 12px 14px; 
            margin-top: 6px; 
            background-color: var(--input-bg);
            border: 1px solid var(--card-border); 
            color: var(--text-main);
            font-size: 1rem; 
            border-radius: 10px;
            outline: none;
            transition: all 0.2s;
        }

        select:focus, input:focus { 
            border-color: var(--primary); 
            box-shadow: 0 0 15px var(--card-glow);
        }

        button.btn-primary { 
            width: 100%; 
            background: var(--primary-gradient);
            color: #ffffff; 
            font-weight: 800; 
            border: none; 
            padding: 14px; 
            font-size: 0.95rem;
            border-radius: 10px;
            cursor: pointer; 
            margin-top: 18px; 
            text-transform: uppercase;
            letter-spacing: 1px;
            box-shadow: 0 4px 20px rgba(2, 132, 199, 0.3);
            transition: all 0.2s;
        }

        button.btn-primary:hover { transform: translateY(-2px); filter: brightness(1.1); }
        button.btn-primary:active { transform: translateY(0); }

        .btn-danger { 
            background: rgba(244, 63, 94, 0.15); 
            color: var(--danger); 
            border: 1px solid rgba(244, 63, 94, 0.3); 
            padding: 6px 12px; 
            font-size: 0.85rem; 
            font-weight: 700;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.2s;
        }
        .btn-danger:hover { background: var(--danger); color: white; }

        .stats-grid { display: grid; grid-template-columns: 1fr; gap: 20px; margin-bottom: 20px; }

        .stat-card-header { 
            font-size: 1.3rem; 
            font-weight: 800; 
            margin-bottom: 16px; 
            display: flex; 
            justify-content: space-between; 
            align-items: center; 
        }

        .stat-sections { display: grid; grid-template-columns: 1fr; gap: 12px; }
        @media (min-width: 640px) { .stat-sections { grid-template-columns: repeat(2, 1fr); } }

        .stat-block { 
            background: rgba(0, 0, 0, 0.2); 
            border: 1px solid var(--card-border); 
            border-radius: 12px; 
            padding: 14px; 
        }

        /* Hover Tooltip -tyylit statistiikoille */
        .tooltip-wrap {
            position: relative;
            cursor: help;
            border-bottom: 1px dotted rgba(255, 255, 255, 0.2);
            padding-bottom: 2px;
        }

        .tooltip-wrap::after {
            content: attr(data-tooltip);
            position: absolute;
            bottom: 125%;
            left: 50%;
            transform: translateX(-50%) translateY(4px);
            background: rgba(15, 23, 42, 0.95);
            color: #f8fafc;
            border: 1px solid var(--card-border);
            padding: 8px 12px;
            font-size: 0.82rem;
            font-weight: 500;
            border-radius: 8px;
            white-space: normal;
            width: max-content;
            max-width: 240px;
            text-align: center;
            box-shadow: 0 10px 25px rgba(0,0,0,0.5);
            opacity: 0;
            visibility: hidden;
            transition: all 0.2s ease-in-out;
            pointer-events: none;
            z-index: 100;
            line-height: 1.3;
        }

        .tooltip-wrap:hover::after {
            opacity: 1;
            visibility: visible;
            transform: translateX(-50%) translateY(0);
        }

        .info-icon {
            font-size: 0.75rem;
            color: var(--primary);
            margin-left: 3px;
            opacity: 0.7;
        }

        .stat-row { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; }
        .stat-row:last-child { margin-bottom: 0; }
        .stat-label { font-size: 0.88rem; color: var(--text-muted); font-weight: 600; display: flex; align-items: center; }
        .stat-value { font-size: 1.15rem; font-weight: 800; color: var(--text-main); }

        .medals-flex { display: flex; justify-content: space-around; text-align: center; }
        .medal-item { display: flex; flex-direction: column; align-items: center; }
        .medal-item .val { font-size: 1.3rem; font-weight: 800; }
        .medal-item .lbl { font-size: 0.75rem; color: var(--text-muted); font-weight: 700; text-transform: uppercase; margin-top: 2px; }

        .chart-container { position: relative; width: 100%; height: 320px; margin-top: 10px; }

        .table-responsive { overflow-x: auto; border-radius: 12px; border: 1px solid var(--card-border); }

        table { width: 100%; border-collapse: collapse; font-size: 1rem; text-align: left; }
        th, td { padding: 14px 18px; border-bottom: 1px solid var(--card-border); white-space: nowrap; }
        th { background-color: rgba(0, 0, 0, 0.25); color: var(--text-muted); font-weight: 800; text-transform: uppercase; font-size: 0.82rem; letter-spacing: 0.8px; }
        tr:last-child td { border-bottom: none; }

        .ampuja-item { 
            display: flex; 
            justify-content: space-between; 
            align-items: center; 
            background: rgba(0,0,0,0.2); 
            padding: 10px 14px; 
            margin-top: 8px; 
            border: 1px solid var(--card-border);
            border-radius: 10px;
        }

        .ampuja-checkbox-wrap { display: flex; align-items: center; gap: 12px; }
        .ampuja-checkbox-wrap input[type="checkbox"] { width: 20px; height: 20px; accent-color: var(--primary); cursor: pointer; }

        #statusText { font-size: 0.95rem; color: var(--primary); margin-top: 10px; text-align: center; font-weight: 700; }
        
        .tag { background: rgba(255, 255, 255, 0.05); color: var(--text-main); padding: 5px 12px; font-size: 0.9rem; font-weight: 700; border-radius: 8px; display: inline-block; border: 1px solid var(--card-border); }
        .tag-laji { background: rgba(56, 189, 248, 0.12); color: var(--primary); border-color: rgba(56, 189, 248, 0.3); }
        .tag-pb { background: rgba(251, 191, 36, 0.15); color: var(--gold); border-color: rgba(251, 191, 36, 0.4); }

        .kiti-link { color: var(--primary); text-decoration: none; font-weight: 700; }
        .kiti-link:hover { text-decoration: underline; }

        .info-box { 
            background: rgba(251, 191, 36, 0.1); 
            border: 1px solid rgba(251, 191, 36, 0.3); 
            color: var(--gold); 
            padding: 14px 20px; 
            font-size: 0.95rem; 
            margin-bottom: 20px;
            border-radius: 12px;
            font-weight: 600;
        }

        .h2h-card {
            background: var(--card-bg);
            border: 1px solid var(--card-border);
            border-radius: 16px;
            padding: 16px 24px;
            margin-bottom: 20px;
            display: flex;
            justify-content: space-around;
            align-items: center;
            text-align: center;
        }
        .h2h-stat { font-size: 1.4rem; font-weight: 800; }
        .h2h-label { font-size: 0.82rem; color: var(--text-muted); font-weight: 700; text-transform: uppercase; margin-top: 2px; }

        .club-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 10px; margin-top: 10px; }
        .club-box { background: rgba(0,0,0,0.2); border: 1px solid var(--card-border); padding: 12px; border-radius: 10px; font-size: 0.9rem; }
    </style>
</head>
<body data-theme="dark">

<div class="container">
    <header class="glass-card">
        <div class="header-content">
            <svg class="header-target-icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
                <circle cx="50" cy="50" r="48" fill="none" stroke="#94a3b8" stroke-width="3"/>
                <circle cx="50" cy="50" r="41" fill="none" stroke="#94a3b8" stroke-width="3"/>
                <circle cx="50" cy="50" r="34" fill="none" stroke="#94a3b8" stroke-width="3"/>
                <circle cx="50" cy="50" r="27" fill="#1e293b" stroke="#94a3b8" stroke-width="3"/>
                <circle cx="50" cy="50" r="20" fill="#1e293b" stroke="#94a3b8" stroke-width="3"/>
                <circle cx="50" cy="50" r="13" fill="#1e293b" stroke="#94a3b8" stroke-width="3"/>
                <circle cx="50" cy="50" r="6" fill="#1e293b" stroke="#38bdf8" stroke-width="3"/>
                <circle cx="50" cy="50" r="2" fill="#38bdf8"/>
            </svg>
            <div class="header-text">
                <h1>Ampumaurheilun tulostilastot</h1>
                <p>KITI-tulosstatistiikka & analytiikka</p>
            </div>
        </div>
        <button class="theme-btn" onclick="vaihdaTeema()" id="themeToggleBtn">☀️ Vaalea</button>
    </header>

    <div class="grid">
        <!-- Sivupaneeli -->
        <div>
            <div class="glass-card" style="margin-bottom: 20px;">
                <div class="card-inner">
                    <h2>Lisää ampuja</h2>
                    <label for="uusiNimi">Nimi</label>
                    <input type="text" id="uusiNimi" placeholder="Esim. Joni Virtanen">

                    <label for="uusiId">Sportti-ID</label>
                    <input type="text" id="uusiId" placeholder="Esim. 29364659">

                    <button class="btn-primary" id="lisaaBtn" onclick="lisaaJaHaeAmpuja()">+ Hae tulokset</button>
                    <div id="statusText"></div>

                    <div style="display:flex; justify-content:space-between; align-items:center; margin-top: 18px; border-top: 1px solid var(--card-border); padding-top: 14px;">
                        <label style="margin:0;">Tallennetut (max 5)</label>
                        <span id="ampujatMaara" style="font-size:0.95rem; color:var(--primary); font-weight:bold;">0/5</span>
                    </div>
                    <div id="ampujatLista" style="margin-top: 8px;"></div>
                </div>
            </div>

            <div class="glass-card" style="margin-bottom: 20px;">
                <div class="card-inner">
                    <h2>Suodatus</h2>
                    <label for="lajiSelect">Laji</label>
                    <select id="lajiSelect" onchange="paivitaValikot(false); paivitaNakyma();">
                        <option value="Kaikki">Kaikki lajit</option>
                    </select>

                    <label for="sarjaSelect">Sarja</label>
                    <select id="sarjaSelect" onchange="paivitaNakyma();">
                        <option value="Kaikki">Kaikki sarjat</option>
                    </select>

                    <label for="maaraSelect">Kilpailujen määrä</label>
                    <select id="maaraSelect" onchange="paivitaNakyma();">
                        <option value="kaikki" selected>Kaikki kisat</option>
                        <option value="3">Viimeiset 3 kilpailua</option>
                        <option value="5">Viimeiset 5 kilpailua</option>
                        <option value="10">Viimeiset 10 kilpailua</option>
                    </select>
                </div>
            </div>

            <div class="glass-card">
                <div class="card-inner">
                    <h2>Seurayhteenveto</h2>
                    <div id="seuraYhteenveto" class="club-grid"></div>
                </div>
            </div>
        </div>

        <!-- Pääsisältö -->
        <div>
            <div id="vertailuIlmoitus" class="info-box" style="display: none;">
                ⚠️ Vertailua varten valitse vasemmalta tietty <b>Laji</b> ja <b>Sarja</b>.
            </div>

            <div id="h2hSection" class="h2h-card glass-card" style="display: none;"></div>

            <div class="glass-card" style="margin-bottom: 20px;">
                <div class="card-inner">
                    <h2>Statistiikka</h2>
                    <div id="ampujatStats" class="stats-grid"></div>
                    <div class="chart-container">
                        <canvas id="tulosKaavio"></canvas>
                    </div>
                </div>
            </div>

            <div class="glass-card">
                <div class="card-inner">
                    <h2>Tuloshistoria</h2>
                    <div class="table-responsive">
                        <table>
                            <thead>
                                <tr>
                                    <th>Pvm</th>
                                    <th>Kilpailu</th>
                                    <th>Ampuja</th>
                                    <th>Seura</th>
                                    <th>Laji</th>
                                    <th>Sarja</th>
                                    <th>Tulos</th>
                                </tr>
                            </thead>
                            <tbody id="tulosTaulukko"></tbody>
                        </table>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>

<script>
const KITI_VERSIO = "v108.0_TOOLTIPS";
if (localStorage.getItem("kiti_versio") !== KITI_VERSIO) {
    localStorage.clear();
    localStorage.setItem("kiti_versio", KITI_VERSIO);
}

let ampujat = JSON.parse(localStorage.getItem("kiti_ampujat")) || [];
let tulosData = JSON.parse(localStorage.getItem("kiti_tulokset")) || [];
let myChart = null;

const variPaletti = ['#38bdf8', '#f43f5e', '#10b981', '#fbbf24', '#a855f7'];

const lajiMap = {
    "1": "10m ilmakivääri",
    "2": "10m ilmapistooli",
    "8": "Pienoispistooli",
    "9": "Vapaapistooli",
    "10": "Isopistooli",
    "11": "Vakiopistooli"
};

function alusta() {
    const tallennettuTeema = localStorage.getItem("kiti_teema") || "dark";
    asetaTeema(tallennettuTeema);

    ampujat.forEach(a => { if (a.aktiivinen === undefined) a.aktiivinen = true; });
    paivitaAmpujatLista();
    paivitaValikot(true);
    paivitaNakyma();
}

function vaihdaTeema() {
    const nykyinen = document.body.getAttribute("data-theme");
    const uusi = nykyinen === "dark" ? "light" : "dark";
    asetaTeema(uusi);
    localStorage.setItem("kiti_teema", uusi);
    paivitaNakyma();
}

function asetaTeema(teema) {
    document.body.setAttribute("data-theme", teema);
    const btn = document.getElementById("themeToggleBtn");
    btn.innerHTML = teema === "light" ? "🌙 Tumma" : "☀️ Vaalea";
}

function etsiKilpailunNimi(row) {
    if (row.competition && typeof row.competition === 'object') {
        const c = row.competition;
        if (c.name) return String(c.name);
        if (c.competition_name) return String(c.competition_name);
        if (c.title) return String(c.title);
    }
    if (row.competition_name) return String(row.competition_name);
    if (row.competitionName) return String(row.competitionName);
    if (row.name) return String(row.name);
    return "Kilpailu";
}

function etsiKilpailuId(row) {
    if (row.competition && typeof row.competition === 'object') {
        const c = row.competition;
        if (c.id !== undefined && c.id !== null) return c.id;
    }
    if (row.competition_id !== undefined && row.competition_id !== null) return row.competition_id;
    if (row.competitionId !== undefined && row.competitionId !== null) return row.competitionId;
    if (row.id !== undefined && row.id !== null) return row.id;
    return null;
}

function lueSeura(row) {
    if (row.club_name) return String(row.club_name);
    if (row.clubName) return String(row.clubName);
    if (row.club && typeof row.club === 'object') {
        return String(row.club.name || row.club.short_name || row.club.title || "Muu");
    }
    if (row.club) return String(row.club);
    if (row.association) return String(row.association);
    if (row.team) return String(row.team);
    if (row.organization) return String(row.organization);
    
    if (row.competitor && typeof row.competitor === 'object') {
        const comp = row.competitor;
        if (comp.club_name) return String(comp.club_name);
        if (comp.club && typeof comp.club === 'object') return String(comp.club.name || comp.club.short_name || "");
        if (comp.club) return String(comp.club);
    }
    return "-";
}

function muunnaLajiksi(arvo) {
    if (arvo === undefined || arvo === null) return null;
    const str = String(arvo).trim();
    if (lajiMap[str]) return lajiMap[str];
    if (isNaN(str)) return str;
    return null;
}

function lueLaji(row) {
    if (row.competition && typeof row.competition === 'object') {
        const c = row.competition;
        if (c.type_info) {
            if (typeof c.type_info === 'object' && c.type_info.name) {
                const nimi = muunnaLajiksi(c.type_info.name);
                if (nimi) return nimi;
            } else {
                const nimi = muunnaLajiksi(c.type_info);
                if (nimi) return nimi;
            }
        }
        if (c.type !== undefined) {
            const nimi = muunnaLajiksi(c.type);
            if (nimi) return nimi;
        }
    }

    const mahdolliset = [row.type, row.disciplineName, row.sportName, row.sport, row.discipline];
    for (const m of mahdolliset) {
        if (m !== undefined && m !== null) {
            if (typeof m === 'object') {
                const nimi = muunnaLajiksi(m.name || m.title || m.code);
                if (nimi) return nimi;
            } else {
                const nimi = muunnaLajiksi(m);
                if (nimi) return nimi;
            }
        }
    }

    const kisaNimi = etsiKilpailunNimi(row).toLowerCase();
    if (kisaNimi.includes("ilmakivääri")) return "10m ilmakivääri";
    if (kisaNimi.includes("ilmapistooli")) return "10m ilmapistooli";
    if (kisaNimi.includes("pienoispistooli")) return "Pienoispistooli";
    if (kisaNimi.includes("vapaapistooli")) return "Vapaapistooli";
    if (kisaNimi.includes("isopistooli")) return "Isopistooli";

    return "Muu laji";
}

function lueSarja(row) {
    if (row.category !== undefined && row.category !== null) {
        if (typeof row.category === 'object') {
            return String(row.category.name || row.category.code || "Muu").trim();
        }
        return String(row.category).trim();
    }
    if (row.series !== undefined) return String(row.series).trim();
    
    if (row.competition && typeof row.competition === 'object') {
        const c = row.competition;
        if (c.category) return String(c.category).trim();
    }
    return "Muu";
}

function lueSija(row) {
    const sijaArvot = [row.position, row.position_pre, row.rank, row.placement];
    for (const s of sijaArvot) {
        if (s !== undefined && s !== null && s !== "") {
            const parsed = parseInt(s, 10);
            if (!isNaN(parsed) && parsed > 0) return parsed;
        }
    }
    return null;
}

function tunnistaKisanPaivamaara(row) {
    let pvm = "";
    if (row.competition && typeof row.competition === 'object') {
        const c = row.competition;
        pvm = c.date_start || c.start_date || c.competition_start_date || c.date || "";
    }
    if (!pvm) {
        pvm = row.competition_start_date || row.start_date || row.date_start || row.date || "";
    }

    if (pvm) return String(pvm).substring(0, 10);

    const txt = JSON.stringify(row);
    const isoMatch = txt.match(/\b(202[4-6]-(?:0[1-9]|1[0-2])-(?:0[1-9]|[12][0-9]|3[01]))\b/);
    if (isoMatch) return isoMatch[1];

    return "2026-01-01";
}

async function lisaaJaHaeAmpuja() {
    if (ampujat.length >= 5) {
        alert("Voit lisätä enintään 5 ampujaa vertailuun.");
        return;
    }

    const nimi = document.getElementById("uusiNimi").value.trim();
    const id = document.getElementById("uusiId").value.trim();
    if (!nimi || !id) return alert("Nimi ja Sportti-ID vaaditaan!");

    const statusEl = document.getElementById("statusText");
    statusEl.innerText = `Haetaan tuloksia...`;

    try {
        const response = await fetch(`/api/kiti?id=${id}&nocache=${Date.now()}`);
        const contentType = response.headers.get("content-type");

        if (!contentType || !contentType.includes("application/json")) {
            throw new Error(`Palvelinvirhe (${response.status}).`);
        }

        const resData = await response.json();
        if (!response.ok) throw new Error(resData.error || `Palvelinvirhe (${response.status})`);

        const rows = Array.isArray(resData) ? resData : (resData.content || resData.results || resData.data || []);

        if (rows.length === 0) {
            throw new Error("Antamallasi Sportti-ID:llä ei löytynyt tuloksia.");
        }

        const uudet = rows.map((row) => {
            const tRaw = row.score !== undefined ? row.score : (row.totalScore !== undefined ? row.totalScore : (row.result !== undefined ? row.result : 0));
            const tulos = parseFloat(String(tRaw).replace(",", "."));

            return {
                pvm: tunnistaKisanPaivamaara(row),
                kilpailu: etsiKilpailunNimi(row),
                kisaId: etsiKilpailuId(row),
                ampuja: nimi,
                seura: lueSeura(row),
                laji: lueLaji(row),
                sarja: lueSarja(row),
                tulos: tulos,
                sija: lueSija(row)
            };
        }).filter(r => r.tulos > 0);

        if (uudet.length > 0) {
            if (!ampujat.some(a => a.id === id)) {
                ampujat.push({ nimi, id, aktiivinen: true });
            } else {
                let olemassa = ampujat.find(a => a.id === id);
                olemassa.nimi = nimi;
            }
            localStorage.setItem("kiti_ampujat", JSON.stringify(ampujat));

            tulosData = [...tulosData.filter(d => d.ampuja !== nimi), ...uudet];
            localStorage.setItem("kiti_tulokset", JSON.stringify(tulosData));

            statusEl.innerText = `Löytyi ${uudet.length} tulosta!`;
            
            document.getElementById("uusiNimi").value = "";
            document.getElementById("uusiId").value = "";
            paivitaAmpujatLista();
            paivitaValikot(true);
            paivitaNakyma();
        } else {
            statusEl.innerText = "Ei kelvollisia tuloksia.";
        }
    } catch (e) {
        statusEl.innerText = `Virhe: ${e.message}`;
    }
}

function vaihdaAmpujanTila(index, state) {
    ampujat[index].aktiivinen = state;
    localStorage.setItem("kiti_ampujat", JSON.stringify(ampujat));
    paivitaValikot(false);
    paivitaNakyma();
}

function poistaAmpuja(index) {
    const poistettava = ampujat[index];
    ampujat.splice(index, 1);
    localStorage.setItem("kiti_ampujat", JSON.stringify(ampujat));
    
    tulosData = tulosData.filter(d => d.ampuja !== poistettava.nimi);
    localStorage.setItem("kiti_tulokset", JSON.stringify(tulosData));

    paivitaAmpujatLista();
    paivitaValikot(false);
    paivitaNakyma();
}

function paivitaAmpujatLista() {
    const lista = document.getElementById("ampujatLista");
    const maaraEl = document.getElementById("ampujatMaara");
    const lisaaBtn = document.getElementById("lisaaBtn");

    maaraEl.innerText = `${ampujat.length}/5`;
    lisaaBtn.disabled = ampujat.length >= 5;

    if (ampujat.length === 0) {
        lista.innerHTML = '<p style="font-size:0.92rem; color:var(--text-muted); margin:2px 0;">Ei tallennettuja.</p>';
        return;
    }
    lista.innerHTML = ampujat.map((a, i) => `
        <div class="ampuja-item">
            <div class="ampuja-checkbox-wrap">
                <input type="checkbox" id="amp_chk_${i}" ${a.aktiivinen !== false ? 'checked' : ''} onchange="vaihdaAmpujanTila(${i}, this.checked)">
                <label for="amp_chk_${i}" style="margin:0; cursor:pointer; font-weight:700; color:var(--text-main); font-size:0.98rem; text-transform:none;">${a.nimi}</label>
            </div>
            <button class="btn-danger" onclick="poistaAmpuja(${i})">Poista</button>
        </div>
    `).join("");
}

function jarjestaPvmMukaan(dataArr, uusinEnsin = true) {
    return [...dataArr].sort((a, b) => {
        const timeA = new Date(a.pvm).getTime() || 0;
        const timeB = new Date(b.pvm).getTime() || 0;
        return uusinEnsin ? timeB - timeA : timeA - timeB;
    });
}

function paivitaValikot(asetaUusinOletukseksi = false) {
    const lajiSelect = document.getElementById("lajiSelect");
    const sarjaSelect = document.getElementById("sarjaSelect");

    const valittuLaji = lajiSelect.value;
    let valittuSarja = sarjaSelect.value;

    const aktiivisetAmpujatNimet = ampujat.filter(a => a.aktiivinen !== false).map(a => a.nimi);
    const aktiivinenData = tulosData.filter(d => aktiivisetAmpujatNimet.includes(d.ampuja));

    const lajit = ["Kaikki", ...new Set(aktiivinenData.map(d => d.laji))];
    lajiSelect.innerHTML = lajit.map(l => `<option value="${l}">${l}</option>`).join("");

    if (asetaUusinOletukseksi && aktiivinenData.length > 0) {
        const uusinRivi = jarjestaPvmMukaan(aktiivinenData, true)[0];
        if (uusinRivi && lajit.includes(uusinRivi.laji)) {
            lajiSelect.value = uusinRivi.laji;
        }
    } else if (lajit.includes(valittuLaji)) {
        lajiSelect.value = valittuLaji;
    } else {
        lajiSelect.value = "Kaikki";
    }

    const aktiivinenLaji = lajiSelect.value;
    const suodatettuDataLajinMukaan = aktiivinenData.filter(d => aktiivinenLaji === "Kaikki" || d.laji === aktiivinenLaji);
    
    const sarjat = ["Kaikki", ...new Set(suodatettuDataLajinMukaan.map(d => d.sarja))];
    sarjaSelect.innerHTML = sarjat.map(s => `<option value="${s}">${s}</option>`).join("");

    if (sarjat.includes(valittuSarja)) {
        sarjaSelect.value = valittuSarja;
    } else if (asetaUusinOletukseksi && suodatettuDataLajinMukaan.length > 0) {
        const uusinRivi = jarjestaPvmMukaan(suodatettuDataLajinMukaan, true)[0];
        if (uusinRivi && sarjat.includes(uusinRivi.sarja)) {
            sarjaSelect.value = uusinRivi.sarja;
        }
    } else {
        sarjaSelect.value = "Kaikki";
    }
}

function laskeKA(arr) {
    if (!arr || arr.length === 0) return "-";
    return (arr.reduce((a, b) => a + b, 0) / arr.length).toFixed(1);
}

function laskeKisakunto(arr) {
    if (!arr || arr.length === 0) return "-";
    const viisi = arr.slice(0, 5);
    if (viisi.length <= 2) {
        return laskeKA(viisi);
    }
    const kopio = [...viisi].sort((a, b) => a - b);
    kopio.shift();
    kopio.pop();
    if (kopio.length === 0) return laskeKA(viisi);
    return (kopio.reduce((a, b) => a + b, 0) / kopio.length).toFixed(1);
}

function laskeHajonta(arr) {
    if (!arr || arr.length < 2) return 0;
    const ka = arr.reduce((a, b) => a + b, 0) / arr.length;
    const neliotSumma = arr.reduce((a, b) => a + Math.pow(b - ka, 2), 0);
    return Math.sqrt(neliotSumma / arr.length);
}

function laskeTasaisuus(arr) {
    if (!arr || arr.length < 2) return "-";
    const ka = arr.reduce((a, b) => a + b, 0) / arr.length;
    const hajonta = laskeHajonta(arr);
    if (ka === 0) return "-";
    const varianssiProsentti = (hajonta / ka) * 100;
    const tasaisuus = Math.max(0, Math.min(100, 100 - (varianssiProsentti * 4))).toFixed(0);
    return `${tasaisuus}%`;
}

function paivitaH2H(aktiivisetAmpujat, data) {
    const h2hEl = document.getElementById("h2hSection");
    if (aktiivisetAmpujat.length !== 2) {
        h2hEl.style.display = "none";
        return;
    }

    const amp1 = aktiivisetAmpujat[0].nimi;
    const amp2 = aktiivisetAmpujat[1].nimi;

    const data1 = data.filter(d => d.ampuja === amp1);
    const data2 = data.filter(d => d.ampuja === amp2);

    let amp1Voitot = 0;
    let amp2Voitot = 0;
    let tasan = 0;

    data1.forEach(r1 => {
        const r2 = data2.find(d => d.kilpailu === r1.kilpailu && d.laji === r1.laji);
        if (r2) {
            if (r1.tulos > r2.tulos) amp1Voitot++;
            else if (r2.tulos > r1.tulos) amp2Voitot++;
            else tasan++;
        }
    });

    const ka1 = laskeKA(data1.map(d => d.tulos));
    const ka2 = laskeKA(data2.map(d => d.tulos));

    h2hEl.style.display = "flex";
    h2hEl.innerHTML = `
        <div>
            <div class="h2h-stat" style="color:${variPaletti[0]};">${amp1}</div>
            <div class="h2h-label">Keskiarvo: ${ka1}</div>
        </div>
        <div>
            <div class="h2h-stat">${amp1Voitot} - ${amp2Voitot} ${tasan > 0 ? `(${tasan} tasan)` : ''}</div>
            <div class="h2h-label">Keskinäiset voitot</div>
        </div>
        <div>
            <div class="h2h-stat" style="color:${variPaletti[1]};">${amp2}</div>
            <div class="h2h-label">Keskiarvo: ${ka2}</div>
        </div>
    `;
}

function paivitaSeuraYhteenveto(data) {
    const seuraEl = document.getElementById("seuraYhteenveto");
    if (!data || data.length === 0) {
        seuraEl.innerHTML = '<span style="font-size:0.85rem; color:var(--text-muted);">Ei tietoja.</span>';
        return;
    }

    const seurat = {};
    data.forEach(d => {
        const s = d.seura || "Ei seuraa";
        if (!seurat[s]) seurat[s] = [];
        seurat[s].push(d.tulos);
    });

    seuraEl.innerHTML = Object.keys(seurat).map(s => {
        const ka = laskeKA(seurat[s]);
        return `
            <div class="club-box">
                <b style="color:var(--text-main);">${s}</b>
                <div style="color:var(--text-muted); font-size:0.8rem; margin-top:2px;">KA: <b style="color:var(--primary);">${ka}</b> (${seurat[s].length} kisaa)</div>
            </div>
        `;
    }).join("");
}

async function paivitaNakyma() {
    const valittuLaji = document.getElementById("lajiSelect").value;

    const aktiivisetAmpujat = ampujat.filter(a => a.aktiivinen !== false);
    const aktiivisetAmpujatNimet = aktiivisetAmpujat.map(a => a.nimi);

    const onEiValittu = (valittuLaji === "Kaikki" || valittuSarja === "Kaikki");
    if (aktiivisetAmpujatNimet.length > 1 && onEiValittu) {
        infoEl.style.display = "block";
    } else {
        infoEl.style.display = "none";
    }

    let data = tulosData.filter(d => 
        aktiivisetAmpujatNimet.includes(d.ampuja) &&
        (valittuLaji === "Kaikki" || d.laji === valittuLaji) &&
        (valittuSarja === "Kaikki" || d.sarja === valittuSarja)
    );

    paivitaH2H(aktiivisetAmpujat, data);
    paivitaSeuraYhteenveto(data);

    const statsContainer = document.getElementById("ampujatStats");

    const ampujaEnnatykset = {};
    aktiivisetAmpujatNimet.forEach(amp => {
        const aData = tulosData.filter(d => d.ampuja === amp);
        const maxTulos = aData.length > 0 ? Math.max(...aData.map(d => d.tulos)) : 0;
        ampujaEnnatykset[amp] = maxTulos;
    });

    if (aktiivisetAmpujat.length > 0) {
        statsContainer.innerHTML = aktiivisetAmpujat.map((ampObj, idx) => {
            const amp = ampObj.nimi;
            const aRivitKaikki = jarjestaPvmMukaan(data.filter(d => d.ampuja === amp), true);
            
            let aRivitRajattu = aRivitKaikki;
            if (maaraValinta !== "kaikki") {
                const rajoitus = parseInt(maaraValinta, 10);
                aRivitRajattu = aRivitKaikki.slice(0, rajoitus);
            }

            const aTuloksetRajatut = aRivitRajattu.map(d => d.tulos);
            
            const kaValitut = laskeKA(aTuloksetRajatut);
            const kisakunto = laskeKisakunto(aTuloksetRajatut);

            let kultaa = 0;
            let hopeaa = 0;
            let pronssia = 0;
            aRivitRajattu.forEach(d => {
                if (d.sija === 1) kultaa++;
                else if (d.sija === 2) hopeaa++;
                else if (d.sija === 3) pronssia++;
            });

            const pb = ampujaEnnatykset[amp] || "-";
            const valitunAjanParas = aTuloksetRajatut.length > 0 ? Math.max(...aTuloksetRajatut) : pb;

            let trendiTxt = "-";
            if (aRivitRajattu.length >= 2) {
                const ero = (aRivitRajattu[0].tulos - aRivitRajattu[1].tulos).toFixed(1);
                trendiTxt = ero > 0 ? `+${ero}` : `${ero}`;
            }

            const hajonta = laskeHajonta(aTuloksetRajatut).toFixed(1);
            const tasaisuus = laskeTasaisuus(aTuloksetRajatut);
            const vari = variPaletti[idx % variPaletti.length];

            return `
                <div style="border-left: 4px solid ${vari}; padding-left: 12px;">
                    <div class="stat-card-header" style="color:${vari};">${amp} <span style="font-size:0.9rem; color:var(--text-muted); font-weight:normal;">(${aRivitRajattu.length} kisaa)</span></div>
                    
                    <div class="stat-sections">
                        <!-- Mitalit & Sijat -->
                        <div class="stat-block">
                            <div class="medals-flex">
                                <div class="medal-item tooltip-wrap" data-tooltip="Ensimmäiset sijat valituissa kilpailuissa"><span class="val" style="color:var(--gold);">🏆 ${kultaa}</span><span class="lbl">1. sijat</span></div>
                                <div class="medal-item tooltip-wrap" data-tooltip="Toiset sijat valituissa kilpailuissa"><span class="val" style="color:var(--silver);">🥈 ${hopeaa}</span><span class="lbl">2. sijat</span></div>
                                <div class="medal-item tooltip-wrap" data-tooltip="Kolmannet sijat valituissa kilpailuissa"><span class="val" style="color:var(--bronze);">🥉 ${pronssia}</span><span class="lbl">3. sijat</span></div>
                            </div>
                        </div>

                        <!-- Keskiarvot & Kunto -->
                        <div class="stat-block">
                            <div class="stat-row">
                                <span class="stat-label tooltip-wrap" data-tooltip="Viimeisen 5 kisan keskiarvo (paras ja heikoin tulos poistettu tasoittamaan poikkeamia)">Kisakunto (5 kisaa) <span class="info-icon">ⓘ</span></span>
                                <span class="stat-value" style="color:var(--primary);">${kisakunto}</span>
                            </div>
                            <div class="stat-row">
                                <span class="stat-label tooltip-wrap" data-tooltip="Kaikkien suodatuksella näkyvissä olevien kilpailujen aritmeettinen keskiarvo">Keskiarvo (Valitut) <span class="info-icon">ⓘ</span></span>
                                <span class="stat-value">${kaValitut}</span>
                            </div>
                        </div>

                        <!-- Ennätykset -->
                        <div class="stat-block">
                            <div class="stat-row">
                                <span class="stat-label tooltip-wrap" data-tooltip="Ampujan kaikkien aikojen paras tulos kyseisessä lajissa">Ennätys (PB) <span class="info-icon">ⓘ</span></span>
                                <span class="stat-value" style="color:var(--gold);">${pb}</span>
                            </div>
                            <div class="stat-row">
                                <span class="stat-label tooltip-wrap" data-tooltip="Paras tulos valitulta ajanjaksolta tai kisa-rajoituksella">Valitun paras <span class="info-icon">ⓘ</span></span>
                                <span class="stat-value">${valitunAjanParas}</span>
                            </div>
                        </div>

                        <!-- Tasaisuus & Trendi -->
                        <div class="stat-block">
                            <div class="stat-row">
                                <span class="stat-label tooltip-wrap" data-tooltip="Suoritusvarmuus 0-100% laskettuna hajonnasta. Korkeampi lukema tarkoittaa tasaisempaa ammuntaa.">Tasaisuus <span class="info-icon">ⓘ</span></span>
                                <span class="stat-value">${tasaisuus}</span>
                            </div>
                            <div class="stat-row">
                                <span class="stat-label tooltip-wrap" data-tooltip="Standardipoikkeama ±pisteinä sekä kaksi viimeisimmän kisan välinen tulosmuutos (+/-)">Hajonta / Trendi <span class="info-icon">ⓘ</span></span>
                                <span class="stat-value">±${hajonta} (${trendiTxt})</span>
                            </div>
                        </div>
                    </div>
                </div>
            `;
        }).join("");
    } else {
        statsContainer.innerHTML = '<div style="font-size:0.98rem; color:var(--text-muted); padding:10px;">Ei aktiivisia ampujia valittuna.</div>';
    }

    let taulukkoData = data;
    if (maaraValinta !== "kaikki") {
        const rajoitus = parseInt(maaraValinta, 10);
        let ryhmitetty = [];
        aktiivisetAmpujatNimet.forEach(amp => {
            const ampujaRivit = jarjestaPvmMukaan(data.filter(d => d.ampuja === amp), true).slice(0, rajoitus);
            ryhmitetty.push(...ampujaRivit);
        });
        taulukkoData = ryhmitetty;
    }

    const tbody = document.getElementById("tulosTaulukko");

    tbody.innerHTML = jarjestaPvmMukaan(taulukkoData, true).map((d) => {
        let kilpailuSolu = d.kilpailu;
        if (d.kisaId) {
            kilpailuSolu = `<a href="https://kiti.ampumaurheiluliitto.fi/#/competition/${d.kisaId}" target="_blank" class="kiti-link">${d.kilpailu} ↗</a>`;

        const ampIndex = aktiivisetAmpujat.findIndex(a => a.nimi === d.ampuja);

        const pbTag = isPB ? `<span class="tag tag-pb" title="Henkilökohtainen ennätys">⭐ PB</span>` : '';

        return `
            <tr style="border-left: 4px solid ${vari};">

                <td><span class="tag tag-laji">${d.laji}</span></td>
                <td><span class="tag">${d.sarja}</span></td>
                <td><b>${d.tulos}</b> ${pbTag} ${d.sija ? `(Sija ${d.sija})` : ''}</td>
            </tr>
        `;
    }).join("");

    piirraKaavio(taulukkoData, valittuLaji, valittuSarja, ampujaEnnatykset);
}

function piirraKaavio(data, valittuLaji, valittuSarja, ampujaEnnatykset) {
    const ctx = document.getElementById('tulosKaavio').getContext('2d');
    
    if (myChart) { myChart.destroy(); }

    const aktiivisetAmpujatNimet = ampujat.filter(a => a.aktiivinen !== false).map(a => a.nimi);
    const jarjestettyKokoData = jarjestaPvmMukaan(data, false);
    
    const labelSet = new Set();
    jarjestettyKokoData.forEach(d => {
        labelSet.add(d.kilpailu);
    });
    const labels = Array.from(labelSet);

    const naytetaankoSijoituksia = (valittuLaji === "Kaikki" || valittuSarja === "Kaikki");
    const isDark = document.body.getAttribute("data-theme") === "dark";

    const datasets = aktiivisetAmpujatNimet.map((amp, idx) => {
        const ampujaRivit = data.filter(d => d.ampuja === amp);
        const vari = variPaletti[idx % variPaletti.length];
        
        const pointRadii = [];
        const pointData = labels.map(lbl => {
            const hit = ampujaRivit.find(d => d.kilpailu === lbl);
            if (!hit) {
                pointRadii.push(5);
                return null;
            }

            const isPB = (!naytetaankoSijoituksia && hit.tulos === ampujaEnnatykset[amp]);
            pointRadii.push(isPB ? 9 : 5);

            if (naytetaankoSijoituksia) {
                return hit.sija ? hit.sija : null;
            } else {
                return hit.tulos;
            }
        });

        return {
            label: naytetaankoSijoituksia ? `${amp} (Sijoitukset)` : amp,
            data: pointData,
            borderColor: vari,
            backgroundColor: vari,
            borderWidth: 3.5,
            tension: 0.2,
            spanGaps: true,
            pointRadius: pointRadii,
            pointHoverRadius: 8
        };
    });

    myChart = new Chart(ctx, {
        type: 'line',
        data: { 
            labels: labels,
            datasets: datasets 
        },
        options: {
            responsive: true,
            maintainAspectRatio: false,
            plugins: { 
                legend: { 
                    display: true, 
                    position: 'top',
                    labels: { color: isDark ? '#f8fafc' : '#0f172a', boxWidth: 16, font: { size: 13, weight: '700' } }
                },
                tooltip: {
                    callbacks: {
                        title: function(context) {
                            return context[0].label || "";
                        },
                        label: function(context) {
                            const val = context.raw;
                            const ampName = context.dataset.label.replace(" (Sijoitukset)", "");
                            const isPB = (!naytetaankoSijoituksia && val === ampujaEnnatykset[ampName]);
                            
                            if (naytetaankoSijoituksia) {
                                return `${context.dataset.label}: Sija ${val}`;
                            }
                            return `${context.dataset.label}: ${val} pnt ${isPB ? '⭐ (Ennätys!)' : ''}`;
                        }
                    }
                }
            },
            scales: { 
                x: { display: false },
                y: {
                    reverse: naytetaankoSijoituksia,
                    ticks: { 
                        color: isDark ? '#94a3b8' : '#475569', 
                        font: { size: 12, weight: '600' },
                        callback: function(value) {
                            if (naytetaankoSijoituksia) return `${value}. sija`;
                            return value;
                        }
                    },
                    grid: { color: isDark ? 'rgba(255,255,255,0.04)' : 'rgba(0,0,0,0.05)' }
                }
            }
        }
    });
}

window.onload = alusta;
</script>
</body>
</html>
