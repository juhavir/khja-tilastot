<!DOCTYPE html>
<html lang="fi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>KITI Tulosvertailu</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        :root { 
            --bg: #0b1329;
            --card-bg: #162032;
            --card-border: #26354a;
            --primary: #38bdf8;
            --primary-hover: #0284c7;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --danger: #f87171;
            --input-bg: #0b132a;
        }

        * { box-sizing: border-box; border-radius: 0 !important; }

        body { 
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; 
            background-color: var(--bg); 
            color: var(--text-main); 
            margin: 0; 
            padding: 12px; 
            font-size: 0.9rem;
        }

        .container { max-width: 1280px; margin: 0 auto; }

        header { 
            background: var(--card-bg);
            border: 1px solid var(--card-border);
            padding: 12px 16px; 
            margin-bottom: 12px; 
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        header h1 { margin: 0; font-size: 1.2rem; color: var(--primary); text-transform: uppercase; letter-spacing: 0.5px; }
        header p { margin: 0; color: var(--text-muted); font-size: 0.8rem; }

        .grid { display: grid; grid-template-columns: 1fr; gap: 12px; }
        @media (min-width: 900px) { .grid { grid-template-columns: 290px 1fr; } }

        .card { 
            background: var(--card-bg); 
            padding: 12px 14px; 
            margin-bottom: 12px; 
            border: 1px solid var(--card-border); 
        }

        h2 { 
            font-size: 0.85rem; 
            margin: 0 0 10px 0; 
            color: var(--primary); 
            border-bottom: 1px solid var(--card-border); 
            padding-bottom: 6px; 
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        label { display: block; margin-top: 8px; font-weight: 600; font-size: 0.75rem; color: var(--text-muted); text-transform: uppercase; }

        select, input { 
            width: 100%; 
            padding: 7px 10px; 
            margin-top: 3px; 
            background-color: var(--input-bg);
            border: 1px solid var(--card-border); 
            color: var(--text-main);
            font-size: 0.85rem; 
            outline: none;
        }

        select:focus, input:focus { border-color: var(--primary); }

        button { 
            width: 100%; 
            background-color: var(--primary); 
            color: #0b132a; 
            font-weight: 700; 
            border: none; 
            padding: 8px 10px; 
            font-size: 0.85rem;
            cursor: pointer; 
            margin-top: 10px; 
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        button:hover { background-color: var(--primary-hover); color: white; }

        .btn-danger { background-color: transparent; color: var(--danger); border: 1px solid var(--danger); margin: 0; padding: 2px 6px; font-size: 0.7rem; width: auto; }
        .btn-danger:hover { background-color: var(--danger); color: white; }

        .stats-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 8px; margin-bottom: 12px; }

        .stat-box { 
            background: var(--input-bg); 
            padding: 8px 10px; 
            border: 1px solid var(--card-border); 
        }

        .stat-header { font-size: 0.8rem; font-weight: bold; margin-bottom: 6px; display: flex; justify-content: space-between; align-items: center; }
        
        .sub-stats-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 4px; text-align: center; background: rgba(255,255,255,0.02); padding: 4px; border: 1px solid var(--card-border); }
        .sub-stat { display: flex; flex-direction: column; }
        .sub-stat .val { font-weight: bold; font-size: 0.95rem; color: var(--text-main); }
        .sub-stat .lbl { font-size: 0.6rem; color: var(--text-muted); margin-top: 1px; }

        .chart-container { position: relative; width: 100%; height: 260px; }

        .table-responsive { overflow-x: auto; -webkit-overflow-scrolling: touch; }

        table { width: 100%; border-collapse: collapse; margin-top: 4px; font-size: 0.8rem; text-align: left; }
        th, td { padding: 6px 8px; border-bottom: 1px solid var(--card-border); white-space: nowrap; }
        th { background-color: var(--input-bg); color: var(--text-muted); font-weight: 600; text-transform: uppercase; font-size: 0.7rem; }

        .ampuja-item { 
            display: flex; 
            justify-content: space-between; 
            align-items: center; 
            background: var(--input-bg); 
            padding: 6px 8px; 
            margin-top: 4px; 
            border: 1px solid var(--card-border);
            font-size: 0.8rem; 
        }

        #statusText { font-size: 0.75rem; color: var(--primary); margin-top: 6px; text-align: center; word-break: break-word; }
        .tag { background: #26354a; color: var(--text-main); padding: 2px 5px; font-size: 0.7rem; font-weight: 600; display: inline-block; }
        .tag-laji { background: rgba(56, 189, 248, 0.15); color: var(--primary); border: 1px solid rgba(56, 189, 248, 0.3); }
    </style>
</head>
<body>

<div class="container">
    <header>
        <h1>🎯 KITI Tulosvertailu</h1>
        <p>Ampumaurheilun tulos- ja kehitysseuranta</p>
    </header>

    <div class="grid">
        <div>
            <div class="card">
                <h2>Lisää ampuja</h2>
                <label for="uusiNimi">Nimi:</label>
                <input type="text" id="uusiNimi" placeholder="Esim. Matti Meikäläinen">

                <label for="uusiId">Sportti-ID:</label>
                <input type="text" id="uusiId" placeholder="Esim. 60332562">

                <button onclick="lisaaJaHaeAmpuja()">+ Hae tulokset</button>
                <div id="statusText"></div>

                <label style="margin-top: 14px;">Tallennetut ampujat:</label>
                <div id="ampujatLista"></div>
            </div>

            <div class="card">
                <h2>Suodatus</h2>
                <label for="lajiSelect">Laji:</label>
                <select id="lajiSelect" onchange="paivitaValikot(false); paivitaNakyma();">
                    <option value="Kaikki">Kaikki lajit</option>
                </select>

                <label for="sarjaSelect">Sarja:</label>
                <select id="sarjaSelect" onchange="paivitaNakyma();">
                    <option value="Kaikki">Kaikki sarjat</option>
                </select>
            </div>
        </div>

        <div>
            <div class="card">
                <h2>Keskiarvot & Trendi</h2>
                <div id="ampujatStats" class="stats-grid"></div>
                <div class="chart-container">
                    <canvas id="tulosKaavio"></canvas>
                </div>
            </div>

            <div class="card" style="margin-bottom: 0;">
                <h2>Tuloshistoria</h2>
                <div class="table-responsive">
                    <table>
                        <thead>
                            <tr>
                                <th>Pvm</th>
                                <th>Kilpailu</th>
                                <th>Ampuja</th>
                                <th>Laji</th>
                                <th>Sarja</th>
                                <th>Tulos</th>
                            </tr>
                        </thead>
                        <tbody id="tulosTaulukko"></tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>
</div>

<script>
const KITI_VERSIO = "v7.0_COMPACT_FLAT";
if (localStorage.getItem("kiti_versio") !== KITI_VERSIO) {
    localStorage.clear();
    localStorage.setItem("kiti_versio", KITI_VERSIO);
}

let ampujat = JSON.parse(localStorage.getItem("kiti_ampujat")) || [];
let tulosData = JSON.parse(localStorage.getItem("kiti_tulokset")) || [];
let myChart = null;

const variPaletti = ['#38bdf8', '#f87171', '#34d399', '#fbbf24', '#c084fc', '#f472b6', '#22d3ee'];

function alusta() {
    paivitaAmpujatLista();
    paivitaValikot(true);
    paivitaNakyma();
}

function etsiKilpailunNimi(row) {
    if (row.competition_name) return String(row.competition_name);
    if (row.competitionName) return String(row.competitionName);
    if (row.name) return String(row.name);
    
    if (row.competition && typeof row.competition === 'object') {
        const c = row.competition;
        if (c.name) return String(c.name);
        if (c.competition_name) return String(c.competition_name);
    }
    return "Kilpailu";
}

function tunnistaLaji(row) {
    const txt = JSON.stringify(row).toLowerCase();
    if (txt.includes("ilmakivääri") || txt.includes("ikv") || txt.includes("air rifle")) return "Ilmakivääri";
    if (txt.includes("ilmapistooli") || txt.includes("ipis") || txt.includes("air pistol")) return "Ilmapistooli";
    if (txt.includes("kivääri")) return "Kivääri";
    if (txt.includes("pistooli")) return "Pistooli";
    return row.eventName || row.sportName || row.sport || "Muu laji";
}

function tunnistaSarja(row) {
    if (row.category && typeof row.category === 'object') return row.category.code || row.category.name || "Muu";
    if (row.category) return String(row.category);
    if (row.series) return String(row.series);
    if (row.class_name) return String(row.class_name);
    if (row.className) return String(row.className);
    if (row.category_code) return String(row.category_code);
    return "Muu";
}

function tunnistaKisanPaivamaara(row) {
    const nimi = etsiKilpailunNimi(row).toLowerCase();

    if (nimi.includes("pohjanmaan am") && nimi.includes("pienoiskivääri")) return "2026-08-15";
    if (nimi.includes("kyröön malja 2026")) return "2026-07-18";
    if (nimi.includes("sm26") || nimi.includes("ilma-aseiden sm")) return "2026-04-10";
    if (nimi.includes("kultahippujen ilma-asefinaalit")) return "2026-03-28";
    if (nimi.includes("vanhan paukun kevätkisat")) return "2026-03-07";
    if (nimi.includes("pohjanmaa kultahippu aluemestaruus")) return "2026-03-07";
    if (nimi.includes("pohjanmaan am-kilpailut") && nimi.includes("ilmakivääri")) return "2026-02-14";
    if (nimi.includes("helmikuun kisa")) return "2026-02-06";
    if (nimi.includes("välipäiväkilpailu")) return "2025-12-27";
    if (nimi.includes("vanhan paukun syyskisat")) return "2025-11-08";
    if (nimi.includes("pyhäinpäiväkilpailut")) return "2025-10-31";

    if (row.competition_start_date) return String(row.competition_start_date).substring(0, 10);
    if (row.start_date) return String(row.start_date).substring(0, 10);
    if (row.competition && typeof row.competition === 'object') {
        const c = row.competition;
        if (c.start_date) return String(c.start_date).substring(0, 10);
        if (c.competition_start_date) return String(c.competition_start_date).substring(0, 10);
        if (c.date) return String(c.date).substring(0, 10);
    }
    if (row.date) return String(row.date).substring(0, 10);

    return "2026-01-01";
}

async function lisaaJaHaeAmpuja() {
    const nimi = document.getElementById("uusiNimi").value.trim();
    const id = document.getElementById("uusiId").value.trim();
    if (!nimi || !id) return alert("Nimi ja Sportti-ID vaaditaan!");

    const statusEl = document.getElementById("statusText");
    statusEl.innerText = `Haetaan...`;

    try {
        const response = await fetch(`/api/kiti?id=${id}&nocache=${Date.now()}`);
        const contentType = response.headers.get("content-type");

        if (!contentType || !contentType.includes("application/json")) {
            throw new Error(`Palvelinvirhe (${response.status}).`);
        }

        const resData = await response.json();
        if (!response.ok) throw new Error(resData.error || `Palvelinvirhe (${response.status})`);

        const rows = Array.isArray(resData) ? resData : (resData.content || resData.results || resData.data || []);

        const uudet = rows.map((row) => {
            const tRaw = row.score !== undefined ? row.score : (row.totalScore !== undefined ? row.totalScore : (row.result !== undefined ? row.result : 0));
            
            return {
                pvm: tunnistaKisanPaivamaara(row),
                kilpailu: etsiKilpailunNimi(row),
                ampuja: nimi,
                laji: tunnistaLaji(row),
                sarja: tunnistaSarja(row),
                tulos: parseFloat(String(tRaw).replace(",", "."))
            };
        }).filter(r => r.tulos > 0);

        if (uudet.length > 0) {
            if (!ampujat.some(a => a.id === id)) {
                ampujat.push({ nimi, id });
                localStorage.setItem("kiti_ampujat", JSON.stringify(ampujat));
            }

            tulosData = [...tulosData.filter(d => d.ampuja !== nimi), ...uudet];
            localStorage.setItem("kiti_tulokset", JSON.stringify(tulosData));

            statusEl.innerText = `Löytyi ${uudet.length} tulosta.`;
            
            document.getElementById("uusiNimi").value = "";
            document.getElementById("uusiId").value = "";
            paivitaAmpujatLista();
            paivitaValikot(true);
            paivitaNakyma();
        } else {
            statusEl.innerText = "Ei tuloksia.";
        }
    } catch (e) {
        statusEl.innerText = `Virhe: ${e.message}`;
    }
}

function poistaAmpuja(index) {
    const poistettava = ampujat[index];
    ampujat.splice(index, 1);
    localStorage.setItem("kiti_ampujat", JSON.stringify(ampujat));
    
    tulosData = tulosData.filter(d => d.ampuja !== poistettava.nimi);
    localStorage.setItem("kiti_tulokset", JSON.stringify(tulosData));

    paivitaAmpujatLista();
    paivitaValikot(false);
    paivitaNakyma();
}

function paivitaAmpujatLista() {
    const lista = document.getElementById("ampujatLista");
    if (ampujat.length === 0) {
        lista.innerHTML = '<p style="font-size:0.75rem; color:var(--text-muted); margin:4px 0;">Ei tallennettuja ampujia.</p>';
        return;
    }
    lista.innerHTML = ampujat.map((a, i) => `
        <div class="ampuja-item">
            <span><b>${a.nimi}</b> <span style="font-size:0.7rem; color:var(--text-muted);">(ID: ${a.id})</span></span>
            <button class="btn-danger" onclick="poistaAmpuja(${i})">Poista</button>
        </div>
    `).join("");
}

function jarjestaPvmMukaan(dataArr, uusinEnsin = true) {
    return [...dataArr].sort((a, b) => {
        const timeA = new Date(a.pvm).getTime() || 0;
        const timeB = new Date(b.pvm).getTime() || 0;
        return uusinEnsin ? timeB - timeA : timeA - timeB;
    });
}

function paivitaValikot(asetaUusinOletukseksi = false) {
    const valittuLaji = document.getElementById("lajiSelect").value;
    let valittuSarja = document.getElementById("sarjaSelect").value;

    const lajit = ["Kaikki", ...new Set(tulosData.map(d => d.laji))];
    document.getElementById("lajiSelect").innerHTML = lajit.map(l => `<option value="${l}">${l}</option>`).join("");
    if (lajit.includes(valittuLaji)) document.getElementById("lajiSelect").value = valittuLaji;

    const suodatettuData = tulosData.filter(d => valittuLaji === "Kaikki" || d.laji === valittuLaji);
    const sarjat = ["Kaikki", ...new Set(suodatettuData.map(d => d.sarja))];
    document.getElementById("sarjaSelect").innerHTML = sarjat.map(s => `<option value="${s}">${s}</option>`).join("");

    if (asetaUusinOletukseksi && suodatettuData.length > 0) {
        const uusinRivi = jarjestaPvmMukaan(suodatettuData, true)[0];
        if (uusinRivi && uusinRivi.sarja) {
            valittuSarja = uusinRivi.sarja;
        }
    }

    if (sarjat.includes(valittuSarja)) {
        document.getElementById("sarjaSelect").value = valittuSarja;
    }
}

function laskeKA(arr) {
    if (!arr || arr.length === 0) return "-";
    return (arr.reduce((a, b) => a + b, 0) / arr.length).toFixed(1);
}

function paivitaNakyma() {
    const valittuLaji = document.getElementById("lajiSelect").value;
    const valittuSarja = document.getElementById("sarjaSelect").value;

    let data = tulosData.filter(d => 
        (valittuLaji === "Kaikki" || d.laji === valittuLaji) &&
        (valittuSarja === "Kaikki" || d.sarja === valittuSarja)
    );

    const nimekkäätAmpujat = [...new Set(data.map(d => d.ampuja))];
    const statsContainer = document.getElementById("ampujatStats");

    if (nimekkäätAmpujat.length > 0) {
        statsContainer.innerHTML = nimekkäätAmpujat.map((amp, idx) => {
            const aTuloksetRivit = jarjestaPvmMukaan(data.filter(d => d.ampuja === amp), true);
            const aTulokset = aTuloksetRivit.map(d => d.tulos);
            
            const kaKaikki = laskeKA(aTulokset);
            const kaV5 = laskeKA(aTulokset.slice(0, 5));
            const kaV10 = laskeKA(aTulokset.slice(0, 10));
            const kaV15 = laskeKA(aTulokset.slice(0, 15));

            const max = Math.max(...aTulokset);
            const vari = variPaletti[idx % variPaletti.length];
            return `
                <div class="stat-box" style="border-top: 2px solid ${vari};">
                    <div class="stat-header" style="color:${vari};">${amp} <span style="font-size:0.7rem; color:var(--text-muted); font-weight:normal;">(${aTulokset.length} kisaa | Paras: ${max})</span></div>
                    <div class="sub-stats-grid">
                        <div class="sub-stat"><span class="val">${kaKaikki}</span><span class="lbl">KAIKKI</span></div>
                        <div class="sub-stat"><span class="val">${kaV5}</span><span class="lbl">V5</span></div>
                        <div class="sub-stat"><span class="val">${kaV10}</span><span class="lbl">V10</span></div>
                        <div class="sub-stat"><span class="val">${kaV15}</span><span class="lbl">V15</span></div>
                    </div>
                </div>
            `;
        }).join("");
    } else {
        statsContainer.innerHTML = '<div style="font-size:0.75rem; color:var(--text-muted); padding:4px;">Ei tuloksia.</div>';
    }

    const tbody = document.getElementById("tulosTaulukko");
    tbody.innerHTML = jarjestaPvmMukaan(data, true).map((d) => `
        <tr>
            <td><b>${d.pvm}</b></td>
            <td style="color: var(--text-muted);">${d.kilpailu}</td>
            <td><b>${d.ampuja}</b></td>
            <td><span class="tag tag-laji">${d.laji}</span></td>
            <td><span class="tag">${d.sarja}</span></td>
            <td><b>${d.tulos}</b></td>
        </tr>
    `).join("");

    piirraKaavio(data);
}

function piirraKaavio(data) {
    const ctx = document.getElementById('tulosKaavio').getContext('2d');
    
    if (myChart) { myChart.destroy(); }

    const ampujatLista = [...new Set(data.map(d => d.ampuja))];

    const datasets = ampujatLista.map((amp, idx) => {
        const ampujaData = jarjestaPvmMukaan(data.filter(d => d.ampuja === amp), false);
        const vari = variPaletti[idx % variPaletti.length];
        
        return {
            label: amp,
            data: ampujaData.map(d => ({
                x: `${d.pvm} (${d.kilpailu})`,
                y: d.tulos
            })),
            borderColor: vari,
            backgroundColor: vari,
            borderWidth: 1.5,
            tension: 0.1,
            pointRadius: 4,
            pointHoverRadius: 6
        };
    });

    myChart = new Chart(ctx, {
        type: 'line',
        data: { datasets: datasets },
        options: {
            responsive: true,
            maintainAspectRatio: false,
            plugins: { 
                legend: { 
                    display: true, 
                    position: 'top',
                    labels: { color: '#f8fafc', boxWidth: 12, font: { size: 11 } }
                },
                tooltip: {
                    callbacks: {
                        label: function(context) {
                            return `${context.dataset.label}: ${context.raw.y} pnt`;
                        }
                    }
                }
            },
            scales: { 
                x: { 
                    type: 'category',
                    ticks: {
                        color: '#94a3b8',
                        maxRotation: 45,
                        minRotation: 45,
                        font: { size: 9 }
                    },
                    grid: { color: '#162032' }
                },
                y: {
                    ticks: { color: '#94a3b8', font: { size: 10 } },
                    grid: { color: '#162032' }
                }
            }
        }
    });
}

window.onload = alusta;
</script>
</body>
</html>
